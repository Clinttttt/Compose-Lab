# Development database for ComposeLab.
#
# This file is also teaching material: it is the architecture ComposeLab explains, running the tool that
# explains it. The database is not published to the host beyond what a developer needs for psql and
# migrations, and its data lives in a named volume so it survives the container being recreated.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: composelab
      POSTGRES_USER: composelab
      POSTGRES_PASSWORD: composelab
    ports:
      # Bound to localhost only: this port exists for migrations and psql, not for other services,
      # which would reach the database by name on the project network.
      #
      # A high port rather than 5432, because 5432 is commonly taken on a developer machine — by
      # another Postgres, or by a Windows reserved port range. Nothing inside the project cares: the
      # container port is unchanged and service-to-service traffic never goes through the host.
      - "127.0.0.1:55432:5432"
    volumes:
      # postgres:18 wants a single mount at /var/lib/postgresql and places its data in a subdirectory
      # itself. Mounting /var/lib/postgresql/data — the path taught for postgres:17 and earlier — makes
      # the container exit on startup.
      - composelab-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composelab -d composelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  composelab-postgres-data:
